filetype: xml

detect:
    filename: "\\.(xml|sgml?|rng|svg|plist)$"
    header: "<\\?xml.*\\?>"

rules:
    - preproc:
        start: "<!DOCTYPE"
        end: "[/]?>"
        rules: []

    - comment:
        start: "<!--"
        end: "-->"
        rules: []

    - symbol.tag:
        start: "<\\??"
        end: "\\??>"
        rules:
            - identifier:
                start: '[ \t][:A-Z_a-z\x{C0}-\x{D6}\x{D8}-\x{F6}\x{F8}-\x{2FF}\x{370}-\x{37D}\x{37F}-\x{1FFF}\x{200C}-\x{200D}\x{2070}-\x{218F}\x{2C00}-\x{2FEF}\x{3001}-\x{D7FF}\x{F900}-\x{FDCF}\x{FDF0}-\x{FFFD}\x{10000}-\x{EFFFF}]'
                end: "="
                rules: []
            - constant.string:
                start: "\""
                end: "\""
                skip: "\\\\."
                rules:
                    - constant.specialChar: "\\\\."
            - constant.string:
                start: "'"
                end: "'"
                skip: "\\\\."
                rules:
                    - constant.specialChar: "\\\\."
