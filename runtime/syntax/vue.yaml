filetype: vue

detect:
    filename: "\\.vue$"

rules:
    - default:
        start: "<script.* lang=(ts|'ts'|\"ts\").*>$"
        end: "</script>"
        rules:
            - include: "typescript"

    - default:
        start: "<script.*>$"
        end: "</script>"
        rules:
            - include: "javascript"

    - default:
        start: "<style[^>]*>"
        end: "</style>"
        rules:
            - include: "css"

    - comment.block:
        start: "<!--"
        end: "-->"
        rules:
            - todo: "(TODO|FIXME|NOTE):?"

    - default:
        start: "{{"
        end: "}}"
        rules:
            - include: "javascript"

    # Match any html or vue component closing tag
    - symbol.tag: "</[A-Za-z][A-Za-z0-9_.:-]*[ \\t]*>"

    # A region allows attributes on later lines and arbitrary component names.
    - symbol.tag:
        start: "<[A-Za-z][A-Za-z0-9_.:-]*"
        end: "/?>"
        # Skip quoted attribute values so `>` inside them does not end the tag region.
        skip: >-
            "[^"]*"|'[^']*'
        rules:
            # non-vue attributes
            - identifier: "[A-Za-z_][A-Za-z0-9_.:@#\\[\\]-]*"
            # built-in vue directives, including v-on:click.stop.prevent, v-slot:header, etc
            - special: '(^|[ \t])v-(else-if|text|html|show|if|else|for|on|bind|model|slot|pre|once|memo|cloak)(:[A-Za-z_][A-Za-z0-9_-]*)?(\.[A-Za-z_][A-Za-z0-9_-]*)*\b'
            # vue directives with shorthand like @click.once, :class, etc
            - special: '(^|[ \t])[@:#][A-Za-z_][A-Za-z0-9_-]*(\.[A-Za-z_][A-Za-z0-9_-]*)*\b'
            - symbol: "="
            # attributes string content
            - constant.string: '"[^"]*"'
            - constant.string: "'[^']*'"

    - special: "&([A-Za-z][A-Za-z0-9]*|#[0-9]+|#[xX][0-9a-fA-F]+);"
